<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
<title id="t">One run, from reset to verify</title>
<desc id="d">A numbered run of make run across four lanes: Operator, Collectors, Systems and Evidence pack. The database is reset (1). The exercise uses the service with four accounts, notes and two refusals (2). The alert test makes five wrong logins and an admin grant (3). The log sample, the access list and the changes are read from the systems (4 and 5). The restore test restores a dump of 12,402 rows in 149 seconds (6). The scan checks the locked dependencies (7). The review removes the contractor who left (8). The index maps controls to files (9). Verify applies EVD001 to EVD009 and passes (10); a file edited by hand fails with EVD003 (10x).</desc>
<style>
:root{--paper:#ffffff;--ink:#10243d;--mute:#52677f;--accent:#0a6aa8;--good:#19743f;--warn:#8a5a00}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="899" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="898" rx="16"/>
<text class="title" x="48" y="68">One run, from reset to verify</text>
<text class="caption" x="48" y="100">One run collects six controls and verifies them. Amber: a file edited by hand fails its hash.</text>
<rect class="actor" x="400" y="128" width="120" height="48" rx="24"/>
<text class="lane" x="460" y="158" text-anchor="middle">make run</text>
<rect class="svc" x="595" y="128" width="130" height="48" rx="10"/>
<text class="lane" x="660" y="158" text-anchor="middle">Collectors</text>
<rect class="svc" x="800" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="860" y="158" text-anchor="middle">Systems</text>
<rect class="svc" x="990" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="1050" y="148" text-anchor="middle">Evidence</text>
<text class="lane" x="1050" y="168" text-anchor="middle">pack</text>
<path class="hair" d="M460 176V232M660 176V808M860 176V616M1050 176V808"/>
<path class="hair" d="M66 216V792"/>
<circle class="dot" cx="66" cy="216" r="15"/><text class="num" x="66" y="221" text-anchor="middle">1</text>
<text class="label b t-ink" x="96" y="212">The database is reset</text>
<text class="sub" x="96" y="232">schema and seed; state/ cleared</text>
<path class="sync" d="M460 216H860"/>
<text class="label t-accent" x="676" y="206">reset-db</text>
<circle class="dot" cx="66" cy="280" r="15"/><text class="num" x="66" y="285" text-anchor="middle">2</text>
<text class="label b t-ink" x="96" y="276">exercise uses the service</text>
<text class="sub" x="96" y="296">4 accounts, notes, 2 refusals</text>
<path class="sync" d="M660 280H860"/>
<text class="label t-accent" x="676" y="270">use the API</text>
<circle class="dot" cx="66" cy="344" r="15"/><text class="num" x="66" y="349" text-anchor="middle">3</text>
<text class="label b t-ink" x="96" y="340">alert-test does the thing</text>
<text class="sub" x="96" y="360">5 wrong passwords, an admin grant</text>
<path class="sync" d="M660 344H860"/>
<text class="label t-accent" x="676" y="334">5 wrong logins</text>
<circle class="dot" cx="66" cy="408" r="15"/><text class="num" x="66" y="413" text-anchor="middle">4-5</text>
<text class="label b t-ink" x="96" y="404">log sample, access, changes</text>
<text class="sub" x="96" y="424">events, pg_roles, changes</text>
<path class="read" d="M860 408H660"/>
<text class="label" x="676" y="398">events, access</text>
<circle class="dot" cx="66" cy="472" r="15"/><text class="num" x="66" y="477" text-anchor="middle">6</text>
<text class="label b t-ink" x="96" y="468">restore-test restores a dump</text>
<text class="sub" x="96" y="488">12,402 of 12,402 rows in 149 s</text>
<path class="sync" d="M660 472H860"/>
<text class="label t-accent" x="676" y="462">pg_dump, restore</text>
<circle class="dot" cx="66" cy="536" r="15"/><text class="num" x="66" y="541" text-anchor="middle">7</text>
<text class="label b t-ink" x="96" y="532">scan checks the locked deps</text>
<text class="sub" x="96" y="552">pip-audit, run id in the report</text>
<rect class="slot" x="654" y="518" width="12" height="36" rx="4"/>
<text class="label t-accent" x="676" y="541">pip-audit</text>
<circle class="dot" cx="66" cy="600" r="15"/><text class="num" x="66" y="605" text-anchor="middle">8</text>
<text class="label b t-ink" x="96" y="596">review removes the leaver</text>
<text class="sub" x="96" y="616">contractor-lee; C1 collected again</text>
<path class="sync" d="M660 600H860"/>
<text class="label t-accent" x="676" y="590">remove access</text>
<circle class="dot" cx="66" cy="664" r="15"/><text class="num" x="66" y="669" text-anchor="middle">9</text>
<text class="label b t-ink" x="96" y="660">index maps controls to files</text>
<text class="sub" x="96" y="680">INDEX.md, exceptions, gaps</text>
<path class="async" d="M660 664H1050"/>
<text class="label t-accent" x="676" y="654">INDEX.md</text>
<circle class="dot-g" cx="66" cy="728" r="15"/><text class="num" x="66" y="733" text-anchor="middle">10</text>
<text class="label b t-ink" x="96" y="724">verify checks the pack</text>
<text class="sub" x="96" y="744">EVD001 to EVD009, exit 0 or 1</text>
<path class="read" d="M1050 728H660"/>
<text class="label" x="800" y="718">9 files</text>
<path class="ok" d="M654 728H620"/>
<rect class="win" x="470" y="708" width="150" height="40" rx="10"/>
<text class="label b t-good" x="486" y="733">verify passes</text>
<circle class="dot-w" cx="66" cy="792" r="15"/><text class="num" x="66" y="797" text-anchor="middle">10x</text>
<text class="label b t-warn" x="96" y="788">A file edited by hand</text>
<text class="sub" x="96" y="808">EVD003: the hash no longer fits</text>
<path class="fail" d="M1050 792H660"/>
<text class="label t-warn" x="800" y="782">hash differs</text>
<path class="sync" d="M48 856H112"/><text class="legend" x="124" y="861">sync call</text>
<path class="async" d="M264 856H328"/><text class="legend" x="340" y="861">async message</text>
<path class="read" d="M520 856H584"/><text class="legend" x="596" y="861">read</text>
<path class="fail" d="M696 856H760"/><text class="legend" x="772" y="861">failure path</text>
<path class="ok" d="M928 856H992"/><text class="legend" x="1004" y="861">result</text>
</svg>
